version: 2

sources:
  - name: raw
    dataset: raw
    tables:
      - name: orders
      - name: customers
      - name: order_items
        columns:
          - name: product_id
            tests:
              - relationships:
                  arguments:
                    to: ref('dim_products')
                    field: product_id
          - name: seller_id
            tests:
              - relationships:
                  arguments:
                    to: ref('dim_sellers')
                    field: seller_id
      - name: order_payments
      - name: order_reviews
      - name: products
      - name: sellers
      - name: geolocation
      - name: product_category_name_translation
